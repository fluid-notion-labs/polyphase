[workspace]

[package]
name = "polyphase"
version = "0.1.0"
edition = "2021"
description = "Format-agnostic 3D asset loading. Single crate, Bevy behind a feature flag."
license = "MIT OR Apache-2.0"

[dependencies]
# Core parsing dependencies (always available)
stl_io = "0.8"
tobj = { version = "4.0", default-features = false }
base64 = "0.22"
gltf = { version = "1.4", features = ["import", "extensions"] }
# GLB writer: structured glTF JSON generation (same version as the reader crate)
gltf-json = { version = "1.4", features = ["names", "extensions"] }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
thiserror = "2"

# meshopt-compressed GLB support (EXT_meshopt_compression), optional —
# FFI to meshoptimizer; see docs/architecture/dependencies.md
meshopt = { version = "0.6", optional = true }

# Serialization (needed for Bevy AssetLoader settings, gated behind bevy feature)
serde = { version = "1", features = ["derive"], optional = true }

# Bevy integration (optional, behind feature flag)
bevy = { version = "0.18", default-features = false, optional = true, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_mesh",
] }

# Used by examples/gen_meshopt_fixture.rs
[dev-dependencies]
anyhow = "1"
serde_json = "1"

[features]
default = []
bevy = ["dep:bevy", "dep:serde"]
meshopt = ["dep:meshopt"]
# VTK support was disabled (removed pending loadfu-cnj); re-add
# `vtkio` as an optional dependency with a `vtk` feature when the
# VTK parser work starts.
